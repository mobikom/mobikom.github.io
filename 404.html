<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none';">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>404 - Resource Not Found | Mobikom</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0052cc;
      --cta-bg: #2563eb;
      --cta-hover: #1d4ed8;
      --border: #e2e8f0;
      --btn-alt-bg: #f1f5f9;
      --btn-alt-text: #0f172a;
      --radius: 6px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f19;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --cta-bg: #0284c7;
        --cta-hover: #0369a1;
        --border: #1e293b;
        --btn-alt-bg: #1e293b;
        --btn-alt-text: #f1f5f9;
      }
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .err-box {
      display: grid;
      gap: 1.25rem;
      max-width: 520px;
    }
    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 0.5rem;
    }
    .brand span {
      color: var(--accent);
    }
    .code {
      font-size: clamp(4rem, 10vw, 6rem);
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.04em;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 0.75rem;
    }
    a.btn {
      display: inline-block;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.65rem 1.4rem;
      border-radius: var(--radius);
      transition: background-color 0.15s ease, transform 0.15s ease;
      min-height: 44px;
      line-height: 1.7;
    }
    a.btn-primary {
      background-color: var(--cta-bg);
      color: #ffffff;
    }
    a.btn-primary:hover {
      background-color: var(--cta-hover);
      transform: translateY(-2px);
    }
    a.btn-secondary {
      background-color: var(--btn-alt-bg);
      color: var(--btn-alt-text);
      border: 1px solid var(--border);
    }
    a.btn-secondary:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="err-box">
    <div class="brand">MOBI<span>KOM</span></div>
    <div class="code">404</div>
    <h1>Resource Not Found &bull; Страницата не е намерена</h1>
    <p>
      The requested endpoint does not exist or has been decommissioned on this network node.<br>
      Търсеният адрес не съществува или е преместен на друг възел в мрежата.
    </p>
    <div class="btn-group">
      <a href="/" class="btn btn-primary" title="Return to English Gateway">Home (EN) &rarr;</a>
      <a href="/bg/" class="btn btn-secondary" title="Към българския портал">Начало (BG) &rarr;</a>
    </div>
  </div>
</body>
</html>
